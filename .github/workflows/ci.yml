name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend · lint & tes (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.13", "3.14"]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Pasang dependensi (terkunci dengan hash)
        run: python -m pip install --require-hashes -r requirements-dev.txt
      - name: Ruff (gaya kode + aturan keamanan)
        run: ruff check --output-format=github .
      - name: Tes (SQLite)
        run: python -m pytest -q
      - name: Kontrak OpenAPI harus mutakhir
        run: |
          python -m scripts.ekspor_openapi
          git diff --exit-code -- docs/openapi.json || { echo "::error::docs/openapi.json usang. Jalankan: python -m scripts.ekspor_openapi"; exit 1; }

  backend-mysql:
    name: Backend · migrasi & tes di MySQL 8.4
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root-ci
          MYSQL_DATABASE: flowerbloom
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot-ci --silent"
          --health-interval=5s --health-timeout=5s --health-retries=30
    env:
      DATABASE_URL: mysql+pymysql://root:root-ci@127.0.0.1:3306/flowerbloom?charset=utf8mb4
      UJI_DATABASE_URL: mysql+pymysql://root:root-ci@127.0.0.1:3306/flowerbloom_uji?charset=utf8mb4
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: python -m pip install --require-hashes -r requirements-dev.txt
      - name: Siapkan basis data uji
        run: |
          python - <<'PY'
          import pymysql
          c = pymysql.connect(host="127.0.0.1", user="root", password="root-ci")
          c.cursor().execute("CREATE DATABASE IF NOT EXISTS flowerbloom_uji CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci")
          PY
      - name: Migrasi naik, cek penyimpangan, turun, naik lagi
        run: |
          python -m alembic upgrade head
          python -m alembic check
          python -m alembic downgrade base
          python -m alembic upgrade head
      - name: Tes penuh (kunci baris & konkurensi sungguhan)
        run: python -m pytest -q

  frontend:
    name: Frontend · lint, tipe, tes, build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Aktifkan pnpm (versi dari packageManager)
        run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Tipe API sesuai kontrak backend
        run: pnpm api:check
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:coverage
      - run: pnpm build

  docker:
    name: Docker · build image (tanpa push)
    needs: [backend, frontend]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      matrix:
        komponen: [backend, frontend]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./${{ matrix.komponen }}
          push: false
          cache-from: type=gha,scope=${{ matrix.komponen }}
          cache-to: type=gha,mode=max,scope=${{ matrix.komponen }}
