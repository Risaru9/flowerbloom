version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      python-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      frontend-minor-patch:
        update-types: [minor, patch]
    ignore:
      # TypeScript 7 (port Go) belum menyediakan API JavaScript (ts.factory) yang dipakai openapi-typescript.
      - dependency-name: typescript
        versions: [">=7"]
      # Tipe Node mengikuti runtime di CI dan Docker (Node 24 LTS); naik mayor bersamaan secara manual.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directories: [/backend, /frontend]
    schedule:
      interval: weekly
      day: monday
    ignore:
      # Node mayor (termasuk rilis ganjil non-LTS) dinaikkan manual bersama node-version di workflow.
      - dependency-name: node
        update-types: ["version-update:semver-major"]
